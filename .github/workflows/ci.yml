name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: epoch
          POSTGRES_USER: epoch
          POSTGRES_PASSWORD: epoch-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epoch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://epoch:epoch-local-only@127.0.0.1:5432/epoch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: DATABASE_INTEGRATION=1 pnpm --filter @epoch/web exec vitest run lib/server/database.integration.test.ts
