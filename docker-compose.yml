services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: epoch
      POSTGRES_USER: epoch
      POSTGRES_PASSWORD: epoch-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epoch"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["epoch-postgres:/var/lib/postgresql/data"]

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://epoch:epoch-local-only@postgres:5432/epoch
      EPOCH_DATA_ROOT: /data/satellite-data
    command: ["sh", "-c", "pnpm db:migrate && pnpm baseline:import -- --optional"]
    volumes:
      - ./tmp/satellite-data:/data/satellite-data:ro
    depends_on:
      postgres: { condition: service_healthy }

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://epoch:epoch-local-only@postgres:5432/epoch
      ANALYTICS_URL: http://analytics:8000
      EPOCH_DATA_ROOT: /data/satellite-data
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./tmp/satellite-data:/data/satellite-data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate: { condition: service_completed_successfully }
      analytics: { condition: service_healthy }

  scheduler:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://epoch:epoch-local-only@postgres:5432/epoch
      ANALYTICS_URL: http://analytics:8000
      SCHEDULER_POLL_MS: "30000"
    command: ["pnpm", "scheduler"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      analytics: { condition: service_healthy }

volumes:
  epoch-postgres:
