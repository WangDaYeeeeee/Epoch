[project]
name = "epoch-analytics"
version = "0.1.0"
description = "Deterministic quantitative analytics service for Epoch"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[project.scripts]
epoch-analytics = "epoch_analytics_service.cli:main"

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "jsonschema>=4.25,<5",
  "pytest==9.1.1",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epoch_analytics", "src/epoch_analytics_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
